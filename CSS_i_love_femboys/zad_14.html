<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title></title>
</head>
<body>
    <table width=65% border="1" align="center" cellspacing="0"> 
     <thead> 
    <tr>
<td  align="center" colspan="5" ><h2>Sposoby określania kolorów</h2></td>
    </thead> 
    <tbody
</tr>
<tr>
    <td><h3>a)określanie z użyciem definicji heksadecymalnych</h3></td>
    <td><Textarea disabled cols="60" rows="3"> 
DIV {color:#FFFFFF;}
</Textarea></td>
</tr>
<tr>
    <td><h3>b)określanie z użyciem definicji RGB</h3></td>
    <td><Textarea disabled cols="60" rows="3"> 
DIV {color: rgb(255,100,13);}
liczby od 0 do 255 dla kolorów czerwony, zielony, niebieski, 
</Textarea></td>
</tr>
<tr>
    <td><h3>c)określanie z użyciem nazwy kolorów</h3></td>
    <td><Textarea disabled cols="60" rows="3"> 
DIV {color:red;}
</Textarea></td>
</tr>
<tr>
    <td><h3>d)określanie z użyciem definicji RGB oraz nasycenia kolorów</h3></td>
    <td><Textarea disabled cols="60" rows="3"> 
DIV {color: rgb(10%,40%,78%);} procentowe nasycenie obrazu od 0% do 100%
</Textarea></td>
</tr>
</table>
</tbody>
</table>
</body>
</html>
